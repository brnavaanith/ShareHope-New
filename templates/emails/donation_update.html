<!doctype html>
<html><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /></head>
<body style="margin:0;padding:0;background:#fbf9f7;font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;color:#24181a;">
  <div style="max-width:600px;margin:0 auto;padding:24px;">
    <div style="background:#4a2e35;color:#fbf9f7;border-radius:6px 6px 0 0;padding:20px 24px;">
      <div style="font-family:Fraunces,Georgia,serif;font-size:22px;">ShareHope<span style="color:#f6c492;">*</span></div>
    </div>
    <div style="background:#f7e4d3;border:1px solid #e9dcd2;border-top:0;border-radius:0 0 6px 6px;padding:24px;">
      <h1 style="font-family:Fraunces,Georgia,serif;font-size:20px;color:#38222a;margin:0 0 8px;">{{ title }}</h1>
      <p style="font-size:14px;line-height:1.6;">Hi {{ user.name }},</p>
      <p style="font-size:14px;line-height:1.6;">{{ status_line }}</p>
      {% if detail %}<p style="font-size:14px;line-height:1.6;">{{ detail }}</p>{% endif %}
      <p style="font-size:12px;color:#756367;">Open ShareHope → Tracking to see the full trail.</p>
    </div>
  </div>
</body></html>
